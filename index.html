<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>BionicPOS Reports - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl mb-3">$</div>
            <h1 class="text-xl font-bold">BionicPOS Reports</h1>
            <p class="text-sm text-slate-400">Sign in to view sales reports</p>
        </div>

        <form id="loginForm" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
            <div>
                <label class="text-xs text-slate-400 block mb-1">Email</label>
                <input id="email" type="email" required autocomplete="username"
                       class="w-full bg-slate-800 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Password</label>
                <input id="password" type="password" required autocomplete="current-password"
                       class="w-full bg-slate-800 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <p id="errorMessage" class="text-xs text-rose-400 hidden"></p>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 rounded-xl py-2.5 font-semibold text-sm transition-colors">
                Sign In
            </button>
        </form>

        <p class="text-xs text-slate-500 text-center mt-6">
            Accounts are created in the Supabase dashboard under Authentication &gt; Users.
        </p>
    </div>

    <script>
        const supabaseClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

        async function redirectIfSignedIn() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.replace("dashboard.html");
        }
        redirectIfSignedIn();

        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorEl = document.getElementById("errorMessage");
            errorEl.classList.add("hidden");

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                errorEl.textContent = error.message;
                errorEl.classList.remove("hidden");
                return;
            }
            window.location.replace("dashboard.html");
        });
    </script>
</body>
</html>
